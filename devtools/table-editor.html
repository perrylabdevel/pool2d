<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RailRush Table Editor</title>
  <link rel="stylesheet" href="/styles/design-tokens.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --sidebar-width: 320px;
      --header-height: 48px;
      --panel-bg: #1e1e2e;
      --panel-border: #313244;
      --accent: #89b4fa;
      --accent-hover: #b4befe;
      --text: #cdd6f4;
      --text-muted: #6c7086;
      --success: #a6e3a1;
      --warning: #f9e2af;
      --error: #f38ba8;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #11111b;
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Header */
    .header {
      height: var(--header-height);
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title span {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn:hover {
      background: #313244;
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #11111b;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--error);
    }

    .status-dot.connected {
      background: var(--success);
    }

    /* Main Layout */
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Left Sidebar - Skin Library */
    .sidebar-left {
      width: var(--sidebar-width);
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--panel-border);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .skin-grid {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      align-content: start;
    }

    .skin-card {
      aspect-ratio: 1.5;
      background: #181825;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: all 0.15s;
    }

    .skin-card:hover {
      border-color: var(--panel-border);
    }

    .skin-card.active {
      border-color: var(--accent);
    }

    .skin-card-preview {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a5f2a 0%, #0d3015 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .skin-card-name {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .skin-card-add {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--panel-border);
      background: transparent;
    }

    .skin-card-add:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .table-item {
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 10px;
      background: #181825;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 8px;
    }

    .table-item:hover {
      border-color: var(--accent);
      background: #1e1e2e;
    }

    .table-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(137, 180, 250, 0.25);
    }

    .table-item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .table-item-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Center - Preview */
    .preview-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #11111b;
      position: relative;
    }

    .preview-canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #preview-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .preview-controls {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(30, 30, 46, 0.9);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }

    .preview-controls button {
      height: 32px;
      min-width: 32px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .preview-controls button:hover {
      background: #313244;
    }

    .preview-controls button.active {
      background: var(--accent);
      color: #11111b;
    }

    /* Right Sidebar - Properties */
    .sidebar-right {
      width: var(--sidebar-width);
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--panel-border);
    }

    .tab {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .property-group {
      margin-bottom: 20px;
    }

    .property-group-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .property-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .property-label {
      flex: 1;
      font-size: 13px;
      color: var(--text);
    }

    .property-input {
      width: 80px;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--panel-border);
      background: #181825;
      color: var(--text);
      font-size: 13px;
      text-align: right;
    }

    .property-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .property-slider {
      width: 120px;
      accent-color: var(--accent);
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-swatch {
      width: 32px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid var(--panel-border);
      cursor: pointer;
    }

    /* Bottom Panel - JSON Editor */
    .bottom-panel {
      height: 200px;
      background: var(--panel-bg);
      border-top: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
    }

    .bottom-panel.collapsed {
      height: 32px;
    }

    .bottom-panel-header {
      padding: 8px 16px;
      border-bottom: 1px solid var(--panel-border);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .json-editor {
      flex: 1;
      overflow: hidden;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .json-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .json-toolbar-left {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .json-status {
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 50%;
      text-align: right;
    }

    .json-textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: #11111b;
      color: var(--text);
      padding: 10px 12px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.5;
      outline: none;
    }

    /* Drop Zone */
    .drop-zone {
      position: absolute;
      inset: 0;
      background: rgba(137, 180, 250, 0.1);
      border: 3px dashed var(--accent);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--accent);
      z-index: 100;
    }

    .drop-zone.active {
      display: flex;
    }

    /* Loading */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(17, 17, 27, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--panel-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <span style="color: var(--accent); font-weight: 700;">RailRush</span>
        <span>Table Editor</span>
        <span style="opacity: 0.6; font-weight: 500;" id="active-table-name"></span>
      </div>
      <div class="header-actions">
        <div class="connection-status">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Disconnected</span>
        </div>
        <button class="btn" id="btn-import">Import</button>
        <button class="btn" id="btn-export">Export</button>
        <button class="btn" id="btn-create-prompt">Create Prompt</button>
        <button class="btn" id="btn-save-disk">Save to Disk</button>
        <button class="btn btn-primary" id="btn-push-live">Push Live</button>
        <button class="btn btn-primary" id="btn-push-persist">Push (Persist)</button>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Left Sidebar - Tables + Skins -->
      <aside class="sidebar-left">
        <div class="tabs" style="border-bottom: 1px solid var(--panel-border);">
          <div class="tab active" data-left-tab="tables">Tables</div>
          <div class="tab" data-left-tab="skins">Skins</div>
        </div>

        <div id="left-tab-tables" style="display:flex; flex-direction:column; height: 100%;">
          <div class="panel-header">
            <span>Table Library</span>
            <div style="display:flex; gap:6px;">
              <button class="btn" style="padding: 4px 8px; font-size: 11px;" id="btn-new-table">+ New</button>
              <button class="btn" style="padding: 4px 8px; font-size: 11px;" id="btn-dup-table">Duplicate</button>
            </div>
          </div>
          <div id="table-list" style="flex:1; overflow:auto; padding: 8px;"></div>
          <div style="padding: 10px 12px; border-top: 1px solid var(--panel-border); display:flex; gap:8px;">
            <button class="btn" style="flex:1;" id="btn-delete-table">Delete</button>
            <button class="btn btn-primary" style="flex:1;" id="btn-set-active-table">Set Active</button>
          </div>
        </div>

        <div id="left-tab-skins" style="display:none; flex-direction:column; height: 100%;">
          <div class="panel-header">
            Skin Library
            <button class="btn" style="padding: 4px 8px; font-size: 11px;" id="btn-new-skin">+ New</button>
          </div>
          <div class="skin-grid" id="skin-grid"></div>
        </div>
      </aside>

      <!-- Center - Preview -->
      <main class="preview-container">
        <div class="preview-canvas-wrapper">
          <canvas id="preview-canvas"></canvas>
          <div class="drop-zone" id="drop-zone">Drop skin files here</div>
        </div>
        <div class="preview-controls">
          <button title="Zoom In" id="btn-zoom-in">+</button>
          <button title="Zoom Out" id="btn-zoom-out">-</button>
          <button title="Reset View" id="btn-reset-view">Reset</button>
          <button title="Edit Geometry" id="btn-edit-points">Edit</button>
          <button title="Mirror (default on)" id="btn-toggle-mirror" class="active">Mirror</button>
          <button title="Reset symmetry (mirror pockets/rails)" id="btn-reset-symmetry">Resym</button>
          <button title="Toggle Smart Snapping (Alt = bypass while dragging)" id="btn-toggle-snap" class="active">Snap</button>
          <button title="Toggle Grid Overlay" id="btn-toggle-grid">Grid</button>
          <button title="Toggle Balls" id="btn-toggle-balls" class="active">Balls</button>
          <button title="Toggle Measurements" id="btn-toggle-measure" class="active">Measure</button>
          <button title="Rack Balls" id="btn-rack">Rack</button>
        </div>
      </main>

      <!-- Right Sidebar - Properties -->
      <aside class="sidebar-right">
        <div class="tabs">
          <div class="tab active" data-tab="selection">Selection</div>
          <div class="tab" data-tab="pockets">Pockets</div>
          <div class="tab" data-tab="rails">Rails</div>
          <div class="tab" data-tab="resize">Resize</div>
          <div class="tab" data-tab="save">Save</div>
        </div>
        <div class="tab-content" id="tab-content">
          <!-- Rendered by TableEditorApp -->
        </div>
      </aside>
    </div>

    <!-- Bottom Panel - JSON (collapsed by default) -->
    <div class="bottom-panel collapsed" id="bottom-panel">
      <div class="bottom-panel-header" id="bottom-panel-toggle">
        <span>JSON</span>
        <span>▼</span>
      </div>
      <div class="json-editor" id="json-editor"></div>
    </div>
  </div>

  <script type="module" src="/devtools/table-editor/main.ts"></script>
</body>
</html>
