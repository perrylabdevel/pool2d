<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RailRush - Tournament Grade Billiards</title>
  <link rel="stylesheet" href="/styles/design-tokens.css" />
  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/notifications.css" />
  <link rel="stylesheet" href="/styles/texture-editor.css" />

  <style>
    /* Critical Loading Screen Styles - Inlined for immediate rendering */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(0, 180, 255, 0.15), rgba(0, 11, 26, 0.92));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.35s ease;
    }

    #loading-screen.is-hidden {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    body.is-loading {
      cursor: progress;
    }

    body.is-loading #workspace {
      pointer-events: none;
      user-select: none;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 32px 40px;
      border-radius: 24px;
      background: rgba(13, 20, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      text-align: center;
    }

    .loading-logo {
      max-width: 280px;
      width: 60vw;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.65));
    }

    .loading-spinner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #00B4FF;
      /* var(--color-arcade-blue) fallback */
      animation: loading-spin 1s linear infinite;
    }

    #loading-text {
      margin: 0;
      font-family: 'Impact', 'Arial Black', sans-serif;
      /* var(--font-heading) fallback */
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
    }

    @keyframes loading-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script>
    // Global Error Handler for Device Debugging
    window.onerror = function (msg, url, line, col, error) {
      const errorBox = document.createElement('div');
      errorBox.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:black;color:red;z-index:99999;padding:20px;font-family:monospace;white-space:pre-wrap;overflow:auto;pointer-events:all;font-size:14px;';
      errorBox.textContent = 'CRITICAL ERROR:\n' + msg + '\n\n' + url + ':' + line + ':' + col + '\n\n' + (error ? error.stack : '');
      document.body.appendChild(errorBox);
      return false;
    };

    window.addEventListener('unhandledrejection', function (event) {
      const errorBox = document.createElement('div');
      errorBox.style.cssText = 'position:fixed;top:50%;left:0;width:100%;height:50%;background:rgba(50,0,0,0.9);color:yellow;z-index:99999;padding:20px;font-family:monospace;white-space:pre-wrap;overflow:auto;pointer-events:all;font-size:14px;border-top:2px solid red;';
      errorBox.textContent = 'UNHANDLED PROMISE:\n' + event.reason;
      document.body.appendChild(errorBox);
    });
  </script>
</head>

<body class="is-loading">
  <div id="loading-screen">
    <div class="loading-content">
      <img src="/assets/images/logo.png" alt="RailRush" class="loading-logo" />
      <div class="loading-spinner"></div>
      <p id="loading-text">Loading ball models...</p>
    </div>
  </div>
  <div id="app">
    <div id="workspace">
      <aside id="dock-left">
        <nav id="panel-launcher" class="panel-launcher" aria-label="Tool Panels">
          <button class="panel-launcher-btn" data-panel-id="game-settings" title="Game &amp; UI Settings (O)">
            <span class="panel-launcher-icon">⚙</span>
            <span class="panel-launcher-label">Game</span>
            <span class="panel-launcher-shortcut">O</span>
          </button>
          <button class="panel-launcher-btn" data-panel-id="physics-settings" title="Physics &amp; Aim Assist (S)">
            <span class="panel-launcher-icon">⚗</span>
            <span class="panel-launcher-label">Physics</span>
            <span class="panel-launcher-shortcut">S</span>
          </button>
          <button class="panel-launcher-btn" data-panel-id="modern-geometry-panel" title="Pocket Geometry (G)">
            <span class="panel-launcher-icon">📐</span>
            <span class="panel-launcher-label">Geometry</span>
            <span class="panel-launcher-shortcut">G</span>
          </button>
          <button class="panel-launcher-btn" data-panel-id="render-layer-panel" title="Render Layers (L)">
            <span class="panel-launcher-icon">👁</span>
            <span class="panel-launcher-label">Layers</span>
            <span class="panel-launcher-shortcut">L</span>
          </button>
          <button class="panel-launcher-btn" data-panel-id="texture-panel" title="Texture Editor">
            <span class="panel-launcher-icon">🎨</span>
            <span class="panel-launcher-label">Textures</span>
          </button>
          <button class="panel-launcher-btn" data-panel-id="audio-panel" title="Audio Mixer (U)">
            <span class="panel-launcher-icon">🔊</span>
            <span class="panel-launcher-label">Audio</span>
            <span class="panel-launcher-shortcut">U</span>
          </button>
          <!-- Action: Capture Shot moved from top bar -->
          <button id="capture-shot-btn" class="panel-launcher-btn" title="Capture Shot" aria-label="Capture Shot">
            <span class="panel-launcher-icon">📸</span>
            <span class="panel-launcher-label">Shot</span>
          </button>
        </nav>
      </aside>

      <main id="workspace-main">
        <div id="hud">
          <header class="hud-header" aria-label="Game Header">
            <!-- Left Player -->
            <div id="player1-info" class="hud-player" role="region" aria-label="Player 1 Information">
              <div class="avatar" aria-hidden="true"></div>
              <div class="meta">
                <div class="name" id="p1-name">sosumidude</div>
                <div class="balls-remaining" aria-label="P1 balls potted"></div>
              </div>
            </div>

            <!-- Menu Button (Center) -->
            <button id="hud-menu-btn" class="icon-btn" aria-label="Open Menu"
              style="border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
              <span style="font-size: 24px;">☰</span>
            </button>

            <!-- Right Player -->
            <div id="player2-info" class="hud-player right" role="region" aria-label="Player 2 Information">
              <div class="avatar" aria-hidden="true"></div>
              <div class="meta">
                <div class="name" id="p2-name">Opponent</div>
                <div class="balls-remaining" aria-label="P2 balls potted"></div>
              </div>
            </div>
          </header>

          <!-- Optional: keep mode/turn indicators offscreen but present for now -->
          <div class="hud-meta">
            <div id="mode-indicator" class="hud-mode"></div>
            <div id="turn-indicator" class="hud-turn"></div>
          </div>

          <div id="stats">
            <span id="fps">FPS: 0</span>
            <span id="ups">UPS: 0</span>
          </div>
        </div>

        <!-- Full-screen UI scene canvas (lobby, menus, etc.) - positioned at workspace level -->
        <canvas id="ui-stage"></canvas>

        <div id="canvas-stage">
          <div id="canvas-container">
            <div id="foul-banner" class="hidden"></div>
            <canvas id="game-canvas"></canvas>
            <canvas id="ui-canvas"></canvas>
            <canvas id="debug-canvas"></canvas>
            <img id="reference-overlay" src="/assets/images/reference.png" alt="Reference table overlay"
              class="overlay-hidden" />
          </div>
        </div>
      </main>

      <aside id="dock-right">
        <div id="panel-dock" aria-live="polite">



        </div>
      </aside>
    </div>
    <!-- Dock toggle button - bottom right -->
    <button id="panel-launcher-toggle" class="panel-launcher-toggle" aria-label="Toggle Panels">
      <span class="panel-launcher-icon">☰</span>
    </button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
