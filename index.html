<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pool 2D - Tournament Grade Billiards</title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="top-bar">
          <div id="game-info">
            <div id="mode-indicator">Practice Mode</div>
            <div id="turn-indicator"></div>
            <div id="player-info">
              <div id="player1-info" class="player-panel">
                <span class="player-icon">👤</span>
                <span class="player-label">P1</span>
                <span class="balls-remaining"></span>
              </div>
              <div id="player2-info" class="player-panel">
                <span class="player-icon">👤</span>
                <span class="player-label">P2</span>
                <span class="balls-remaining"></span>
              </div>
            </div>
          </div>
          <div id="controls">
            <button id="pause-btn" class="icon-btn" title="Pause">⏸</button>
            <button id="restart-btn" class="icon-btn" title="Restart">↻</button>
            <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
            <button id="physics-settings-btn" class="icon-btn" title="Physics Settings">⚗</button>
            <button id="debug-toggle" class="icon-btn" title="Debug Mode">🐛</button>
            <button id="capture-shot-btn" class="icon-btn" title="Capture Shot">📸</button>
          </div>
        </div>
        <div id="foul-banner" class="hidden"></div>
        <div id="stats">
          <span id="fps">FPS: 0</span>
          <span id="ups">UPS: 0</span>
        </div>
      </div>
      <div id="canvas-container">
        <canvas id="game-canvas"></canvas>
        <canvas id="debug-canvas"></canvas>
      </div>
      <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
          <h2>Settings</h2>
          
          <div class="settings-section">
            <h3>Game Options</h3>
            <label>
              <input type="checkbox" id="aim-assist-toggle" checked />
              Aim Assist
            </label>
            <label>
              <input type="checkbox" id="call-8-toggle" />
              Call 8-Ball
            </label>
            <label>
              <input type="checkbox" id="show-fps-toggle" checked />
              Show FPS/UPS
            </label>
          </div>

          <div class="settings-section">
            <h3>UI Colors</h3>
            <div class="color-setting">
              <label for="table-color">Table Color</label>
              <input type="color" id="table-color" value="#0a5f0a" />
            </div>
            <div class="color-setting">
              <label for="rail-color">Rail Color</label>
              <input type="color" id="rail-color" value="#2d1810" />
            </div>
            <div class="color-setting">
              <label for="active-player-color">Active Player Color</label>
              <input type="color" id="active-player-color" value="#4CAF50" />
            </div>
            <div class="color-setting">
              <label for="turn-indicator-color">Turn Indicator Color</label>
              <input type="color" id="turn-indicator-color" value="#FFC107" />
            </div>
          </div>

          <div class="modal-actions">
            <button id="settings-reset-ui">Reset Colors</button>
            <button id="settings-close">Close</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
